        let currentSlide = 0;

        function renderSlide() {
            const s = slides[currentSlide];
            const container = document.getElementById('slide-container');
            document.getElementById('slide-counter').textContent = `Слайд ${currentSlide + 1} / ${slides.length}`;

            if (s.isTitle) {
                container.innerHTML = `
                    <div class="slide-enter my-auto text-center space-y-6 py-8">
                        <span class="inline-block px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-orange-500/15 text-orange-400 border border-orange-500/30">
                            ${s.badge}
                        </span>
                        <h1 class="text-3xl sm:text-5xl font-extrabold text-white leading-tight max-w-4xl mx-auto">
                            ${s.title}
                        </h1>
                        <p class="text-slate-300 text-base sm:text-xl max-w-2xl mx-auto">${s.subtitle}</p>
                        <div class="pt-8 mt-8 border-t border-slate-800/90 flex flex-col sm:flex-row items-center justify-center gap-6 text-left max-w-2xl mx-auto">
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 w-full">
                                <div class="text-xs text-slate-400 uppercase font-bold">Автор проекта:</div>
                                <div class="text-sm sm:text-base font-bold text-white mt-1">${s.author}</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 w-full">
                                <div class="text-xs text-slate-400 uppercase font-bold">Руководитель проекта:</div>
                                <div class="text-sm sm:text-base font-bold text-orange-400 mt-1">${s.supervisor}</div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            let bodyHTML = '';
            if (s.cards) {
                bodyHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        ${s.cards.map(c => `
                            <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
                                <h3 class="font-bold text-orange-400 text-base sm:text-lg mb-2">${c.head}</h3>
                                <p class="text-slate-200 text-xs sm:text-sm leading-relaxed whitespace-pre-line">${c.text}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (s.list) {
                bodyHTML = `
                    <div class="space-y-3 mt-6">
                        ${s.list.map((item, idx) => `
                            <div class="bg-slate-900/75 border border-slate-800 p-4 rounded-xl flex items-start gap-4">
                                <span class="w-7 h-7 rounded-lg bg-orange-500/20 text-orange-400 font-bold text-sm flex items-center justify-center shrink-0 mt-0.5">
                                    ${idx + 1}
                                </span>
                                <span class="text-slate-200 text-sm sm:text-base">${item}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (s.bars) {
                bodyHTML = `
                    <div class="space-y-5 mt-8">
                        ${s.bars.map(b => `
                            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <div class="flex justify-between text-sm font-bold mb-2">
                                    <span class="text-slate-200">${b.label}</span>
                                    <span class="text-white text-base">${b.val}%</span>
                                </div>
                                <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden">
                                    <div class="${b.color} h-full rounded-full transition-all duration-700" style="width: ${b.val}%"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="slide-enter">
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-orange-500/15 text-orange-400 border border-orange-500/30 mb-3">
                        ${s.badge}
                    </span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-white">${s.title}</h2>
                    ${bodyHTML}
                </div>
                <div class="pt-6 mt-6 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-500">
                    <span>Проект «ОБЖ.ПРО» • Забродин И. Е., 10 «А»</span>
                    <span>Руководитель: Маклакова И. А.</span>
                </div>
            `;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); }
        }
        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Генерация настоящего файла PowerPoint (.pptx)
        function exportToPPTX() {
            const pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';
            pptx.author = 'Забродин Илья Егорович, 10А';
            pptx.title = 'Проект ОБЖ.ПРО';

            slides.forEach((s, index) => {
                const slide = pptx.addSlide();
                slide.background = { color: '0F172A' };

                // Верхний бейдж
                slide.addText(s.badge.toUpperCase(), {
                    x: 0.6, y: 0.4, w: 8.5, h: 0.35,
                    fontSize: 10, bold: true, color: 'FB923C', fontFace: 'Arial'
                });

                if (s.isTitle) {
                    slide.addText(s.title, {
                        x: 0.6, y: 1.3, w: 8.8, h: 1.4,
                        fontSize: 28, bold: true, color: 'FFFFFF', fontFace: 'Arial'
                    });
                    slide.addText(s.subtitle, {
                        x: 0.6, y: 2.8, w: 8.5, h: 0.8,
                        fontSize: 15, color: 'CBD5E1', fontFace: 'Arial'
                    });
                    slide.addText(`Выполнил: ${s.author}\nРуководитель проекта: ${s.supervisor}`, {
                        x: 0.6, y: 4.1, w: 8.8, h: 1.0,
                        fontSize: 14, bold: true, color: 'F8FAFC', fill: { color: '1E293B' }, margin: 12, fontFace: 'Arial'
                    });
                } else {
                    slide.addText(s.title, {
                        x: 0.6, y: 0.8, w: 8.8, h: 0.6,
                        fontSize: 22, bold: true, color: 'FFFFFF', fontFace: 'Arial'
                    });

                    if (s.cards) {
                        s.cards.forEach((c, i) => {
                            const col = i % 2;
                            const row = Math.floor(i / 2);
                            const xPos = 0.6 + col * 4.5;
                            const yPos = 1.6 + row * 1.75;
                            const height = s.cards.length <= 2 ? 3.2 : 1.6;

                            slide.addText([
                                { text: c.head + '\n', options: { bold: true, fontSize: 13, color: 'FB923C' } },
                                { text: c.text, options: { fontSize: 11.5, color: 'E2E8F0' } }
                            ], {
                                x: xPos, y: yPos, w: 4.3, h: height,
                                fill: { color: '1E293B' }, valign: 'top', margin: 10, fontFace: 'Arial'
                            });
                        });
                    } else if (s.list) {
                        const bulletItems = s.list.map((item, idx) => ({
                            text: `${idx + 1}. ${item}`,
                            options: { fontSize: 13, color: 'F1F5F9', breakLine: true, paraSpaceAfter: 10 }
                        }));
                        slide.addText(bulletItems, {
                            x: 0.6, y: 1.6, w: 8.8, h: 3.4,
                            fill: { color: '1E293B' }, valign: 'top', margin: 14, fontFace: 'Arial'
                        });
                    } else if (s.bars) {
                        s.bars.forEach((b, i) => {
                            const yPos = 1.6 + i * 0.85;
                            slide.addText(`${b.label} — ${b.val}%`, {
                                x: 0.6, y: yPos, w: 8.8, h: 0.35,
                                fontSize: 12, bold: true, color: 'FFFFFF', fontFace: 'Arial'
                            });
                            slide.addShape(pptx.ShapeType.rect, {
                                x: 0.6, y: yPos + 0.38, w: 8.8, h: 0.22, fill: { color: '1E293B' }
                            });
                            slide.addShape(pptx.ShapeType.rect, {
                                x: 0.6, y: yPos + 0.38, w: (8.8 * b.val) / 100, h: 0.22, fill: { color: '10B981' }
                            });
                        });
                    }

                    // Нижний колонтитул
                    slide.addText(`Забродин И. Е. (10 «А») | Руководитель: Маклакова И. А. | Слайд ${index + 1}`, {
                        x: 0.6, y: 5.15, w: 8.8, h: 0.3,
                        fontSize: 9, color: '64748B', fontFace: 'Arial'
                    });
                }
            });

            pptx.writeFile({ fileName: 'Проект_ОБЖ_Забродин_Илья_10А.pptx' });
        }

        renderSlide();
    </script>
</body>
</html>
